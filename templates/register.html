{% extends "base.html" %} {% block title %} Register - PocketSmart AI {%
endblock %} {% block content %}

<section class="page">
  <div class="container">
    <div class="page-title center">
      <h1>Create Your Account</h1>

      <p>Save and manage your AI recommendations.</p>
    </div>

    <div class="form-card">
      <div id="registerError" class="alert error" style="display: none"></div>

      <form id="registerForm">
        <div class="form-group">
          <label> Name </label>

          <input id="name" required minlength="2" placeholder="Your name" />
        </div>

        <div class="form-group">
          <label> Email </label>

          <input
            id="email"
            type="email"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="form-group">
          <label> Password </label>

          <input
            id="password"
            type="password"
            required
            minlength="6"
            placeholder="Minimum 6 characters"
          />
        </div>

        <button class="button" type="submit">Create Account</button>
      </form>

      <p class="muted">
        Already registered?

        <a href="/login" style="color: #6c4cff"> Login </a>
      </p>
    </div>
  </div>
</section>

{% endblock %} {% block scripts %}

<script>
  document
    .getElementById("registerForm")
    .addEventListener("submit", async function (event) {
      event.preventDefault();

      const error = document.getElementById("registerError");

      error.style.display = "none";

      try {
        await registerUser(
          document.getElementById("name").value,
          document.getElementById("email").value,
          document.getElementById("password").value,
        );

        window.location.href = "/dashboard";
      } catch (err) {
        error.textContent = err.message;

        error.style.display = "block";
      }
    });
</script>

{% endblock %}
