{% extends "base.html" %} {% block title %} Login - PocketSmart AI {% endblock
%} {% block content %}

<section class="page">
  <div class="container">
    <div class="page-title center">
      <h1>Welcome Back</h1>

      <p>Login to access your PocketSmart recommendations.</p>
    </div>

    <div class="form-card">
      <div id="loginError" class="alert error" style="display: none"></div>

      <form id="loginForm">
        <div class="form-group">
          <label> Email </label>

          <input
            id="email"
            type="email"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="form-group">
          <label> Password </label>

          <input
            id="password"
            type="password"
            required
            placeholder="Your password"
          />
        </div>

        <button class="button" type="submit">Login</button>
      </form>

      <p class="muted">
        Don't have an account?

        <a href="/register" style="color: #6c4cff"> Register </a>
      </p>
    </div>
  </div>
</section>

{% endblock %} {% block scripts %}

<script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", async function (event) {
      event.preventDefault();

      const error = document.getElementById("loginError");

      error.style.display = "none";

      try {
        await loginUser(
          document.getElementById("email").value,
          document.getElementById("password").value,
        );

        window.location.href = "/dashboard";
      } catch (err) {
        error.textContent = err.message;

        error.style.display = "block";
      }
    });
</script>

{% endblock %}
